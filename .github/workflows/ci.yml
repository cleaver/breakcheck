name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set diagnostics directory
        run: echo "BREAKCHECK_DIAGNOSTICS_DIR=$RUNNER_TEMP/breakcheck-diagnostics-${{ matrix.node-version }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Typecheck production and test sources
        run: npm run typecheck

      - name: Run native CLI bin smoke test
        run: npm run test:cli-bin:built

      - name: Run unit tests with coverage on Node 22
        if: matrix.node-version == '22.x'
        run: npm run test:coverage

      - name: Run unit tests on Node 24
        if: matrix.node-version == '24.x'
        run: npm test

      - name: Run fixture integration tests
        run: npm run test:integration:built

      - name: Run fresh-install packaging tests
        run: npm run test:packaging:built

      - name: Upload coverage reports
        if: always() && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.node-version }}
          path: ${{ runner.temp }}/breakcheck-diagnostics-${{ matrix.node-version }}/
          if-no-files-found: ignore
          retention-days: 7
